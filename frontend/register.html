<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Jurnalul Meu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 400px; margin-top: 50px;">
        <h1>Creează un cont</h1>
        
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" id="reg-name" placeholder="Numele tău" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="email" id="reg-email" placeholder="Adresa de email" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="password" id="reg-password" placeholder="Parola" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            
            <button id="register-btn" style="padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Înregistrare</button>
        </div>
        
        <p style="text-align: center; margin-top: 15px;">
            Ai deja cont? <a href="login.html" style="color: #007bff; text-decoration: none;">Loghează-te aici</a>
        </p>
    </div>

    <script src="register.js"></script>
</body>
</html>
