<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Jurnalul Meu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;">
    
    <div class="stat-box" style="width: 100%; max-width: 400px; padding: 40px;">
        <h1 style="text-align: center; margin-bottom: 30px; font-size: 28px; color: var(--primary-color);">Creează un cont</h1>
        
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <input type="text" id="reg-name" class="review-input" placeholder="Numele tău" style="width: 100%; box-sizing: border-box;">
            <input type="email" id="reg-email" class="review-input" placeholder="Adresa de email" style="width: 100%; box-sizing: border-box;">
            <input type="password" id="reg-password" class="review-input" placeholder="Parola" style="width: 100%; box-sizing: border-box;">
            
            <button id="register-btn" class="btn btn-primary" style="padding: 14px; font-size: 16px; margin-top: 10px;">Înregistrare</button>
        </div>
        
        <p style="text-align: center; margin-top: 15px;">
            Ai deja cont? <a href="login.html" style="color: #007bff; text-decoration: none;">Loghează-te aici</a>
        </p>
    </div>

    <script src="register.js"></script>
</body>
</html>
