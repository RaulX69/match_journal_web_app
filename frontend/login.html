<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logare - Jurnalul Meu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 400px; margin-top: 50px;">
        <h1>Intră în cont</h1>
        
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <input type="email" id="log-email" placeholder="Adresa de email" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            <input type="password" id="log-password" placeholder="Parola" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
            
            <button id="login-btn" style="padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Logare</button>
        </div>
        
        <p style="text-align: center; margin-top: 15px;">
            Nu ai cont? <a href="register.html" style="color: #28a745; text-decoration: none;">Creează unul aici</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
