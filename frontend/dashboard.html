<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Jurnalul Meu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div style="display: flex; flex-wrap: wrap; gap: 30px; max-width: 1300px; margin: 20px auto; padding: 0 20px;">
        
        <div style="flex: 1; min-width: 400px; display: flex; flex-direction: column; gap: 20px;">
            
            <div>
                <a href="index.html" class="btn btn-primary" style="text-decoration: none; display: inline-block;">
                    &larr; Înapoi la Căutare
                </a>
            </div>

            <div id="stats-container" style="display: flex; gap: 15px;">
                <div class="stat-box">
                    <h3 style="margin: 0; color: #007bff; font-size: 14px; text-transform: uppercase;">Total Meciuri</h3>
                    <p id="stat-total" style="font-size: 24px; font-weight: bold; margin: 5px 0 0 0;">0</p>
                </div>
                <div class="stat-box">
                    <h3 style="margin: 0; color: #28a745; font-size: 14px; text-transform: uppercase;">Echipa Favorită</h3>
                    <p id="stat-favorite" style="font-size: 20px; font-weight: bold; margin: 5px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</p>
                </div>
                <div class="stat-box">
                    <h3 style="margin: 0; color: #dc3545; font-size: 14px; text-transform: uppercase;">Media Goluri</h3>
                    <p id="stat-goals" style="font-size: 24px; font-weight: bold; margin: 5px 0 0 0;">0.0</p>
                </div>
            </div>

            <div style="position: sticky; top: 20px;">
                <div id="map" style="height: 500px; width: 100%; border-radius: 12px; border: 1px solid #eaeaea; box-shadow: 0 4px 10px rgba(0,0,0,0.08); z-index: 1;"></div>
            </div>

        </div>

        <div style="flex: 1; min-width: 400px; display: flex; flex-direction: column; gap: 20px;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #333333;">
                <div id="profile-info">
                    <p style="margin: 0; font-size: 16px;">Se încarcă datele...</p>
                </div>
                <button id="logout-btn" class="btn btn-danger">Deconectare</button>
            </div>

            <h2 style="margin: 0; padding-bottom: 10px; border-bottom: 2px solid #eaeaea;">Jurnalul Meu</h2>

            <div id="saved-matches-container" style="overflow-y: auto; max-height: 75vh; padding-right: 10px; display: flex; flex-direction: column; gap: 20px;">
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
